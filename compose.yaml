services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zarsignal
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: zarsignal
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarsignal"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
